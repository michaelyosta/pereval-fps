<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ОПЕРАЦИЯ «ПЕРЕВАЛ» — тактический шутер</title>
<style>
  :root{
    --spread: 6px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0a0c10; font-family:'Segoe UI', system-ui, sans-serif; user-select:none; }
  canvas{ display:block; width:100vw; height:100vh; cursor:crosshair; }

  /* ---- cinematic vignette ---- */
  #vignette{ position:fixed; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%); }

  /* ---- кинематографичная цветокоррекция (тёплый золотой час) ---- */
  #grading{ position:fixed; inset:0; pointer-events:none; z-index:6; mix-blend-mode:soft-light; opacity:.6;
    background: linear-gradient(180deg, rgba(255,168,84,.32) 0%, rgba(150,90,40,.10) 42%, rgba(70,60,110,.20) 100%); }

  /* demo-режим: только прицел и боеприпасы */
  body.demo #score, body.demo #killfeed{ display:none; }

  /* ---- HUD ---- */
  #hud{ position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
  #topbar{ position:absolute; top:18px; left:22px; display:flex; gap:28px; align-items:flex-start; }
  #score{ color:#e8e4da; font-size:15px; letter-spacing:3px; text-transform:uppercase; opacity:.92;
    text-shadow:0 1px 3px rgba(0,0,0,.9); }
  #score b{ font-size:26px; display:block; font-weight:700; color:#fff; margin-top:2px; }
  #killfeed{ position:absolute; top:18px; right:22px; display:flex; flex-direction:column; gap:5px; align-items:flex-end; }
  .kf-entry{ background:rgba(10,12,16,.55); border-left:2px solid rgba(255,180,60,.85); padding:4px 10px;
    font-size:12.5px; letter-spacing:1px; color:#ddd; text-shadow:0 1px 2px #000; animation:kf-in .18s ease-out; }
  .kf-entry b{ color:#fff; }
  .kf-entry .w{ color:#ffb43c; }
  @keyframes kf-in{ from{ transform:translateX(14px); opacity:0; } }

  /* ---- crosshair ---- */
  #crosshair{ position:absolute; left:50%; top:50%; width:0; height:0; }
  .ch-line{ position:absolute; background:#fff; box-shadow:0 0 2px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.5); }
  .ch-t,.ch-b{ width:2px; height:calc(var(--spread) + 9px); left:-1px; }
  .ch-l,.ch-r{ height:2px; width:calc(var(--spread) + 9px); top:-1px; }
  .ch-t{ top:calc(-1 * var(--spread) - 13px); }
  .ch-b{ bottom:calc(-1 * var(--spread) - 13px); }
  .ch-l{ left:calc(-1 * var(--spread) - 13px); }
  .ch-r{ right:calc(-1 * var(--spread) - 13px); }
  .ch-dot{ position:absolute; width:2px; height:2px; background:#fff; left:-1px; top:-1px; box-shadow:0 0 2px rgba(0,0,0,.95); }
  #crosshair.ads{ display:none; }

  /* ---- hitmarker ---- */
  #hitmarker{ position:absolute; left:50%; top:50%; width:0; height:0; opacity:0; }
  #hitmarker .hm{ position:absolute; width:3px; height:15px; background:#fff; box-shadow:0 0 3px rgba(0,0,0,.9); }
  #hitmarker .hm1{ transform:translate(-7.5px,-7.5px) rotate(45deg); }
  #hitmarker .hm2{ transform:translate(4.5px,-7.5px) rotate(-45deg); }
  #hitmarker .hm3{ transform:translate(4.5px,4.5px) rotate(45deg); }
  #hitmarker .hm4{ transform:translate(-7.5px,4.5px) rotate(-45deg); }
  #hitmarker.show{ opacity:1; animation:hm-pop .28s ease-out; }
  #hitmarker.kill .hm{ background:#ff4b3e; }
  @keyframes hm-pop{ 0%{ transform:scale(1.35); opacity:1; } 100%{ transform:scale(.85); opacity:0; } }

  /* ---- damage feedback ---- */
  #damage-vig{ position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(180,0,0,0) 40%, rgba(160,8,8,.55) 100%);
    opacity:0; transition:opacity .12s ease-out; }
  body.lowhp #damage-vig{ opacity:.55; animation:lowhp-pulse 1.1s infinite; }
  @keyframes lowhp-pulse{ 0%,100%{ opacity:.45; } 50%{ opacity:.75; } }

  /* ---- ammo ---- */
  #ammobox{ position:absolute; right:26px; bottom:20px; text-align:right; }
  #weapon-name{ font-size:13px; letter-spacing:3px; color:#c9c4b8; text-transform:uppercase; text-shadow:0 1px 2px #000; }
  #ammo-count{ font-size:44px; font-weight:700; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.9); line-height:1; margin-top:2px; }
  #ammo-count .res{ font-size:22px; color:#b9b4a8; font-weight:600; }
  #reload-hint{ font-size:12px; letter-spacing:2px; color:#ffb43c; text-transform:uppercase; margin-top:4px; opacity:0; }
  #reload-hint.on{ opacity:1; }

  /* ---- здоровье ---- */
  #healthbox{ position:absolute; left:26px; bottom:20px; width:215px; }
  #health-label{ font-size:11px; letter-spacing:3px; color:#c9c4b8; text-transform:uppercase; text-shadow:0 1px 2px #000; margin-bottom:4px; }
  #healthbar{ height:8px; background:rgba(10,12,16,.6); border:1px solid rgba(255,255,255,.12); border-radius:2px; overflow:hidden; }
  #health-fill{ height:100%; width:100%; background:linear-gradient(90deg,#43a047,#7cb342); transition:width .15s ease-out; }

  /* ---- title ---- */
  #title{ position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:radial-gradient(ellipse at 50% 40%, rgba(38,44,52,.82), rgba(6,8,12,.96)); }
  .title-inner{ text-align:center; padding:0 24px; }
  .ops{ font-size:17px; letter-spacing:12px; color:#8f99a6; text-transform:uppercase; }
  h1{ font-size:86px; font-weight:800; letter-spacing:6px; color:#f2ede2; text-shadow:0 4px 24px rgba(0,0,0,.8), 0 0 60px rgba(255,160,60,.18);
    margin:6px 0 2px; }
  .sub{ font-size:14px; letter-spacing:7px; color:#b98a4e; text-transform:uppercase; margin-bottom:34px; }
  .hint{ font-size:17px; color:#fff; letter-spacing:2px; animation:blink 1.6s infinite; }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .controls{ margin-top:26px; font-size:12.5px; letter-spacing:1.5px; color:#7f8895; line-height:1.9; }

  /* ---- death ---- */
  #death{ position:fixed; inset:0; z-index:25; display:none; align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(ellipse at center, rgba(90,0,0,.25), rgba(4,2,2,.9)); }
  #death .d-title{ font-size:64px; font-weight:800; letter-spacing:8px; color:#e8dcd2; text-shadow:0 3px 18px rgba(0,0,0,.9); }
  #death .d-sub{ font-size:15px; letter-spacing:3px; color:#9aa3ad; margin-top:10px; text-transform:uppercase; }

  /* ---- error overlay (dev) ---- */
  #err{ position:fixed; left:8px; bottom:8px; z-index:99; color:#ff6b5e; font:12px/1.5 monospace; background:rgba(0,0,0,.7);
    padding:6px 10px; max-width:70vw; display:none; white-space:pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="vignette"></div>
  <div id="grading"></div>
  <div id="hud">
    <div id="topbar"><div id="score">УБИЙСТВА<b id="kills">0</b></div></div>
    <div id="killfeed"></div>
    <div id="crosshair">
      <div class="ch-line ch-t"></div><div class="ch-line ch-b"></div>
      <div class="ch-line ch-l"></div><div class="ch-line ch-r"></div>
      <div class="ch-dot"></div>
    </div>
    <div id="hitmarker"><div class="hm hm1"></div><div class="hm hm2"></div><div class="hm hm3"></div><div class="hm hm4"></div></div>
    <div id="damage-vig"></div>
    <div id="ammobox">
      <div id="weapon-name"></div>
      <div id="ammo-count"><span id="ammo-cur">30</span> <span class="res">/ <span id="ammo-res">120</span></span></div>
      <div id="reload-hint">перезарядка…</div>
    </div>
    <div id="healthbox">
      <div id="health-label">здоровье</div>
      <div id="healthbar"><div id="health-fill"></div></div>
    </div>
  </div>
  <div id="title">
    <div class="title-inner">
      <div class="ops">Операция</div>
      <h1>«ПЕРЕВАЛ»</h1>
      <div class="sub">тактический шутер · three.js</div>
      <div class="hint">— кликните, чтобы начать —</div>
      <div class="controls">WASD — движение &nbsp;·&nbsp; ЛКМ — огонь &nbsp;·&nbsp; ПКМ — прицел &nbsp;·&nbsp; Shift — спринт<br/>
      R — перезарядка &nbsp;·&nbsp; Пробел — прыжок</div>
    </div>
  </div>
  <div id="death">
    <div>
      <div class="d-title">ВЫ УБИТЫ</div>
      <div class="d-sub">перезапуск…</div>
    </div>
  </div>
  <div id="err"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
